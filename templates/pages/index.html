<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chemistry - Molecular Isomer Calculator</title>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
      // Color mapping for atoms (CPK coloring)
      const atomColors = {
        C: 0x909090, // Carbon - Gray
        H: 0xffffff, // Hydrogen - White
        O: 0xff0d0d, // Oxygen - Red
        N: 0x3050f8, // Nitrogen - Blue
        S: 0xffff30, // Sulfur - Yellow
        P: 0xff8000, // Phosphorus - Orange
      };

      const atomRadii = {
        C: 0.7,
        H: 0.3, // Smaller for hydrogen
        O: 0.66,
        N: 0.65,
        S: 1.0,
        P: 1.0,
      };
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 2rem;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        color: white;
        margin-bottom: 2rem;
      }

      header h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .content {
        background: white;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }

      /* Loading indicator */
      .htmx-request .htmx-indicator {
        display: inline-block;
      }

      .htmx-indicator {
        display: none;
        margin-left: 10px;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #4caf50;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: inline-block;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Molecular Isomer Calculator</h1>
        <p>Calculate and visualize all possible molecular isomers in 3D</p>
      </header>

      <div class="content">{% include 'partials/formula.html' %}</div>
    </div>
  </body>
</html>

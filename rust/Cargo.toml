[package]
name = "chemistry"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.5"
actix-files = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tera = "1.19"
petgraph = "0.6"
regex = "1.10"
itertools = "0.12"
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
